# SGU ACW 后端 API 的入口 vhost。
#
# 浏览器不会直接访问这里：前端在 Cloudflare Pages 上，由 Pages Function 把
# /api/* 转发过来，所以这一层看到的来源是 Cloudflare 的边缘节点。域名用橙云
# 代理，因此可以用 *.hsn8086.com 的 Origin 证书。
#
# 后端只监听 127.0.0.1:8091，对外不暴露端口。

server {
    listen 80 ;
    listen 443 ssl http2 ;
    server_name sgu-acw-api.hsn8086.com ;

    access_log /www/sites/sgu-acw-api.hsn8086.com/log/access.log main ;
    error_log /www/sites/sgu-acw-api.hsn8086.com/log/error.log ;

    # 请求体上限。注册和登录都是小 JSON，1M 已经很宽松。
    client_max_body_size 1m ;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8091 ;
        proxy_set_header Host $host ;
        # 真实客户端 IP 由 Cloudflare 给出，透传给后端记录。
        proxy_set_header X-Real-IP $remote_addr ;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for ;
        proxy_set_header X-Forwarded-Proto $scheme ;
        proxy_http_version 1.1 ;

        # 超时给得比前端短：后端是本地回环，真慢了也是没救，早断早报错。
        proxy_connect_timeout 5s ;
        proxy_read_timeout 30s ;
        proxy_send_timeout 30s ;

        # 会话 Cookie 和成员数据都不该被缓存。
        add_header Cache-Control "no-store" always ;
    }

    location / {
        return 404 ;
    }

    ssl_certificate /www/sites/sgu-acw-api.hsn8086.com/ssl/fullchain.pem ;
    ssl_certificate_key /www/sites/sgu-acw-api.hsn8086.com/ssl/privkey.pem ;
    ssl_protocols TLSv1.3 TLSv1.2 ;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305 ;
    ssl_prefer_server_ciphers on ;
    ssl_session_cache shared:SSL:10m ;
    ssl_session_timeout 10m ;
    error_page 497 https://$host$request_uri ;
    add_header Strict-Transport-Security "max-age=31536000" ;
}
